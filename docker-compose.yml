services:
  postgres:
    image: postgres:16-alpine
    container_name: koloala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_secret
      POSTGRES_DB: koloala
    ports:
      - "5432:5432"
    volumes:
      - koloala_pgdata:/var/lib/postgresql/data
      - ./app/db/sql/01_least_privilege_roles.sql:/docker-entrypoint-initdb.d/01_least_privilege_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d koloala"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  koloala_pgdata:
