[project]
name = "koloala"
version = "0.1.0"
description = "Kode. Love. Lines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.148.0",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
caloala = "caloala:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
